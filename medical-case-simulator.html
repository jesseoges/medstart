<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedStart Surgical Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06111c;color:#fff;font-family:Arial}
header{padding:14px;background:#0b2030;text-align:center}
h1{font-size:20px;margin:0 0 4px}
#app{max-width:850px;margin:auto;padding:10px}
.top{display:flex;justify-content:space-between;margin-bottom:8px}
.bar{height:6px;background:#243746;border-radius:8px}
#progress{height:100%;width:0;background:#20a8ff}
#room{height:470px;position:relative;overflow:hidden;border-radius:15px;
background:linear-gradient(#18384d 0 55%,#0b1720 55%)}
.lamp{position:absolute;top:12px;left:50%;transform:translateX(-50%);
width:130px;height:38px;border-radius:50%;background:#dceaf0;
box-shadow:0 0 40px #b8d9e8}
.table{position:absolute;left:12%;right:12%;top:90px;height:320px;
background:#496779;border-radius:25px}
.patient{position:absolute;left:20%;right:20%;top:40px;height:260px;
background:#bca392;border-radius:100px 100px 35px 35px}
.sheet{position:absolute;left:10%;right:10%;top:55px;height:210px;
background:#dce7eb;border-radius:70px 70px 20px 20px}
.anatomy{position:absolute;left:50%;top:150px;transform:translateX(-50%);
width:145px;height:105px;border-radius:50%;background:#cda9a1;
display:none;border:4px solid #8c6862}
.zone{position:absolute;border:3px dashed #22b5ff;border-radius:15px;
background:#14658a55;padding:10px;display:none;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px #22b5ff}}
#incisionZone{left:50%;top:150px;transform:translateX(-50%);
width:190px;height:80px}
#deliveryZone{left:50%;top:135px;transform:translateX(-50%);
width:160px;height:100px}
#recoveryZone{left:18px;top:120px}
.monitor{position:absolute;right:20px;top:105px;background:#102b3d;
padding:14px;border-radius:10px}
.tray{position:absolute;bottom:12px;right:15px;background:#263c49;
padding:10px;border-radius:12px;display:flex;gap:8px}
.tool{width:70px;height:58px;background:#132b3b;border:2px solid #47677c;
border-radius:9px;text-align:center;padding:7px;cursor:grab}
.tool.active{border-color:#20baff;box-shadow:0 0 15px #20baff}
#held{position:absolute;display:none;z-index:10;pointer-events:none;
font-size:42px}
#message{text-align:center;min-height:25px;padding:8px}
#card{display:none;background:#102b3d;border-left:4px solid #20a8ff;
padding:12px;border-radius:8px}
button{background:#1688d4;color:white;border:0;padding:11px 16px;
border-radius:8px;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🩺 MedStart Surgical Simulator</h1>
<small>Emergency C-Section • Interactive Simulation</small>
</header>

<div id="app">

<div class="top">
<b id="stage"></b>
<b>Score: <span id="score">0</span></b>
</div>

<div class="bar"><div id="progress"></div></div>

<div id="room">

<div class="lamp"></div>

<div class="table">
<div class="patient"></div>
<div class="sheet"></div>
<div class="anatomy" id="anatomy"></div>

<div class="zone" id="incisionZone">
SIMULATED INCISION ZONE
</div>

<div class="zone" id="deliveryZone">
NEONATAL CARE AREA
</div>
</div>

<div class="monitor">📈<br><small>Patient Monitor</small></div>

<div class="tray" id="tray"></div>

<div id="held"></div>

</div>

<div id="message"></div>

<div id="card">
<b>📚 Anatomy / Learning Card</b>
<p id="cardText"></p>
</div>

<br>
<button id="next" onclick="nextStage()" disabled>Next Step →</button>

</div>

<script>

const stages=[
{
title:"Preparation",
task:"Select the scalpel from the instrument tray.",
tool:"🔪",
zone:"incision",
card:"The scalpel is a surgical cutting instrument. In this educational simulation, its use is represented by a non-graphic interaction."
},
{
title:"Simulated Incision",
task:"Drag the scalpel onto the highlighted simulation zone.",
tool:"🔪",
zone:"incision",
card:"The simulation now reveals the next anatomical learning layer. Real surgical incision technique is not being taught here."
},
{
title:"Anatomy Review",
task:"Explore the simulated anatomical layer.",
tool:"🧬",
zone:"incision",
card:"The uterus is the organ that supports pregnancy. The pelvic region also contains the bladder, blood vessels, nerves and other tissues."
},
{
title:"Delivery Coordination",
task:"Select the neonatal care area.",
tool:"👶",
zone:"delivery",
card:"Emergency delivery involves coordination between obstetric, anesthesia and neonatal teams."
},
{
title:"Recovery",
task:"Select the recovery monitoring system.",
tool:"❤️",
zone:"recovery",
card:"Postoperative monitoring helps the clinical team identify changes in the patient's condition."
}
];

let stage=0,score=0,held=false,completed=false;

const room=document.getElementById("room");
const tray=document.getElementById("tray");
const heldEl=document.getElementById("held");
const incision=document.getElementById("incisionZone");
const delivery=document.getElementById("deliveryZone");
const anatomy=document.getElementById("anatomy");
const message=document.getElementById("message");
const card=document.getElementById("card");
const next=document.getElementById("next");

function load(){
let s=stages[stage];

document.getElementById("stage").innerText=
"Step "+(stage+1)+"/"+stages.length+" • "+s.title;

document.getElementById("progress").style.width=
(stage/stages.length*100)+"%";

message.innerText=s.task;
card.style.display="none";
next.disabled=true;
completed=false;

incision.style.display="none";
delivery.style.display="none";
anatomy.style.display="none";

if(s.zone==="incision")incision.style.display="block";
if(s.zone==="delivery")delivery.style.display="block";

tray.innerHTML="";

let t=document.createElement("div");
t.className="tool";
t.innerHTML=s.tool+"<br><small>"+toolName(s.tool)+"</small>";
t.draggable=true;

t.onpointerdown=e=>{
held=true;
heldEl.innerText=s.tool;
heldEl.style.display="block";
move(e);
t.classList.add("active");
};

window.onpointermove=e=>{
if(held)move(e);
};

window.onpointerup=e=>{
if(!held)return;
held=false;
heldEl.style.display="none";
t.classList.remove("active");
checkDrop(e.clientX,e.clientY);
};

tray.appendChild(t);
}

function toolName(x){
if(x==="🔪")return"Scalpel";
if(x==="🧬")return"Anatomy";
if(x==="👶")return"Neonatal";
return"Recovery";
}

function move(e){
let r=room.getBoundingClientRect();
heldEl.style.left=(e.clientX-r.left-20)+"px";
heldEl.style.top=(e.clientY-r.top-25)+"px";
}

function inside(el,x,y){
let r=el.getBoundingClientRect();
return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
}

function checkDrop(x,y){

let s=stages[stage];
let target=s.zone==="delivery"?delivery:incision;

if(inside(target,x,y)){

if(completed)return;
completed=true;
score+=20;
document.getElementById("score").innerText=score;

message.innerText="✅ Correct interaction";

document.getElementById("cardText").innerText=s.card;
card.style.display="block";
next.disabled=false;

if(stage===1){
incision.style.display="none";
anatomy.style.display="block";
message.innerText="✨ Simulation layer changed. Anatomy is now visible.";
}

if(stage===2){
incision.style.display="none";
anatomy.style.display="block";
}

if(stage===3){
delivery.style.display="none";
}

}else{
score=Math.max(0,score-5);
document.getElementById("score").innerText=score;
message.innerText="❌ Try moving the instrument to the highlighted area.";
}
}

function nextStage(){

if(stage<stages.length-1){
stage++;
load();
}else{
finish();
}
}

function finish(){

document.getElementById("progress").style.width="100%";

room.innerHTML=`
<div style="text-align:center;padding:120px 20px">
<div style="font-size:60px">🏆</div>
<h2>Simulation Complete</h2>
<p>Emergency C-Section educational simulation finished.</p>
<h2>${score} points</h2>
<p>Great work. Repeat the case to improve your score.</p>
<button onclick="location.reload()">Restart</button>
</div>`;

message.innerText="";
card.style.display="none";
next.style.display="none";
}

load();

</script>
</body>
</html>
