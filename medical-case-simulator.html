<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedStart Simulator</title>
<style>
body{margin:0;background:#07111f;color:white;font-family:Arial}
header{text-align:center;background:#0d1d31;padding:15px}
h1{color:#48dcff}.app{max-width:900px;margin:auto;padding:15px}
button{background:#168aad;color:white;border:0;border-radius:8px;padding:11px;margin:5px;cursor:pointer}
.box{background:#10233a;padding:15px;border-radius:12px;margin:12px 0}
.hide{display:none}
.scene{height:280px;background:#020911;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.patient{width:65%;height:65%;background:#33495e;border-radius:50%;position:relative}
.body{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#a95c6b;padding:35px;border-radius:50%}
.show{display:block}
.tools{display:flex;flex-wrap:wrap;gap:7px}
.tool{background:#193653;padding:13px;border-radius:8px;cursor:pointer}
.tool:hover{background:#245477}
.card{background:#10464c;padding:15px;border-radius:10px}
#feedback{color:#55e3a5}
</style>
</head>

<body>

<header>
<h1>🩺 MedStart Surgical Simulator</h1>
<p>Interactive Medical Learning</p>
</header>

<div class="app">

<button onclick="start('c')">🚨 Emergency C-Section</button>
<button onclick="start('a')">🦴 Amputation</button>

<div id="game" class="hide">

<div class="box">
<h2 id="title"></h2>
<p id="stage"></p>
<p>Score: <b id="score">0</b></p>
</div>

<div class="box">
<div class="scene">
<div class="patient">
<div id="body" class="body">🧬 Anatomy</div>
</div>
</div>
<h3 id="sceneTitle"></h3>
<p id="sceneText"></p>
</div>

<div class="box">
<h3>🧰 Equipment</h3>
<div id="tools" class="tools"></div>
<p id="feedback">Pick the correct item.</p>
</div>

<div id="learn" class="box">
<h3>🧠 Learning Card</h3>
<p>Select the correct equipment to unlock this stage's lesson.</p>
</div>

<button onclick="next()">Next Stage →</button>

</div>
</div>

<script>

let type="",step=0,score=0;

const cases={

c:{
name:"🚨 Emergency C-Section",
data:[
["Preparation","🧤","Prepare the patient and team.","Preparation focuses on safety and teamwork.",false],
["Monitoring","📈","Monitor the patient.","Monitoring helps detect changes in condition.",false],
["Anatomy","🧬","Study the pelvic anatomy.","The uterus houses the developing pregnancy.",true],
["Uterus","🔦","Focus on uterine anatomy.","The myometrium is the muscular uterine layer.",true],
["Delivery","👶","Prepare for delivery.","The obstetric and neonatal teams coordinate care.",false],
["Recovery","❤️","Begin postoperative monitoring.","Recovery includes observation and follow-up.",false]
]},

a:{
name:"🦴 Amputation",
data:[
["Assessment","🩺","Assess the limb.","Assessment helps determine treatment options.",false],
["Imaging","🩻","Review imaging.","Imaging helps visualize bones and surrounding tissues.",true],
["Circulation","❤️","Assess blood supply.","Adequate circulation supports tissue health.",true],
["Anatomy","🦴","Study limb anatomy.","The limb contains bones, muscles, vessels and nerves.",true],
["Recovery","🏥","Begin recovery care.","Recovery includes monitoring and rehabilitation.",false],
["Rehabilitation","♿","Plan rehabilitation.","Rehabilitation aims to improve mobility and independence.",false]
]}
};

function start(t){
type=t;step=0;score=0;
document.getElementById("game").classList.remove("hide");
document.getElementById("title").textContent=cases[t].name;
load();
}

function load(){

let s=cases[type].data[step];

document.getElementById("stage").textContent=
"Stage "+(step+1)+" / "+cases[type].data.length;

document.getElementById("sceneTitle").textContent=s[0];
document.getElementById("sceneText").textContent=s[2];

document.getElementById("score").textContent=score;

document.getElementById("feedback").textContent="Pick the correct item.";

document.getElementById("learn").innerHTML=
"<h3>🧠 Learning Card</h3>"+
"<p>Select the correct equipment to unlock this lesson.</p>";

document.getElementById("body").classList.remove("show");

let tools=["🧤","📈","🧬","🔦","👶","❤️","🩺","🩻","🦴","🏥","♿"];

document.getElementById("tools").innerHTML="";

tools.forEach(x=>{
let b=document.createElement("div");
b.className="tool";
b.textContent=x;
b.onclick=()=>pick(x,b);
document.getElementById("tools").appendChild(b);
});

}

function pick(x,b){

let s=cases[type].data[step];

if(x===s[1]){

score+=10;
document.getElementById("score").textContent=score;

b.style.background="#17634e";

document.getElementById("feedback").textContent=
"✅ Correct! The simulation continues.";

document.getElementById("learn").innerHTML=
"<div class='card'><h3>🧠 "+s[0]+"</h3><p>"+s[3]+"</p></div>";

if(s[4])
document.getElementById("body").classList.add("show");

}else{

document.getElementById("feedback").textContent=
"❌ Try another item.";
}

}

function next(){

if(step<cases[type].data.length-1){
step++;
load();
}else{
document.getElementById("sceneTitle").textContent="🏆 Simulation Complete";
document.getElementById("sceneText").textContent=
"Final score: "+score;
document.getElementById("tools").innerHTML="";
}
}

</script>

</body>
</html>
