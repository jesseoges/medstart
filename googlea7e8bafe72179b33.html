google-site-verification: googlea7e8bafe72179b33.html<script id="medstart-global-auth">
(function(){
  function readUser(){try{return JSON.parse(localStorage.getItem('medstartUser')||'null')}catch(e){return null}}
  function isSigned(){return localStorage.getItem('medstartSignedIn')==='true'}
  function syncAuth(){
    var user=readUser(), signed=isSigned(), name=(user&&user.name||'').trim();
    // The navigation never contains a Sign Up item.
    document.querySelectorAll('.nav a').forEach(function(a){
      if((a.getAttribute('href')||'').toLowerCase().replace(/^\.\//,'')==='signup.html' || /^(sign\s*up)$/i.test(a.textContent.trim())) a.remove();
    });
    // Keep the header account button on every normal site page.
    document.querySelectorAll('a.signup,[data-auth="signup"]').forEach(function(a){
      if(signed && name){a.textContent=name;a.href='dashboard.html';a.style.display='inline-block';a.classList.add('signed-user');}
      else {a.textContent='Sign Up';a.href='signup.html';a.style.display='inline-block';a.classList.remove('signed-user');}
    });
    document.querySelectorAll('.nav a').forEach(function(a){
      var href=(a.getAttribute('href')||'').toLowerCase().replace(/^\.\//,'');
      if(signed && (href==='signin.html'||href==='sign-in.html')) a.remove();
    });
    document.querySelectorAll('[data-auth-name]').forEach(function(el){el.textContent=signed&&name?name:'Guest';});
    // Attach any anonymous case results to the signed-in account, so results completed before login remain visible.
    if(signed && user && user.email){
      try{
        var generic=JSON.parse(localStorage.getItem('medstartCaseResults')||'{}');
        var by=JSON.parse(localStorage.getItem('medstartCaseResultsByUser')||'{}');
        by[user.email]=by[user.email]||{};
        Object.keys(generic||{}).forEach(function(k){if(!by[user.email][k]) by[user.email][k]=generic[k];});
        localStorage.setItem('medstartCaseResultsByUser',JSON.stringify(by));
        var q=JSON.parse(localStorage.getItem('medstartQuizResults')||'null');
        if(q && !JSON.parse(localStorage.getItem('medstartQuizResultsByUser')||'{}')[user.email]){var qb=JSON.parse(localStorage.getItem('medstartQuizResultsByUser')||'{}');qb[user.email]=q;localStorage.setItem('medstartQuizResultsByUser',JSON.stringify(qb));}
      }catch(e){}
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncAuth);else syncAuth();
  window.addEventListener('storage',syncAuth);
  window.addEventListener('medstart-auth-changed',syncAuth);
  window.medstartSyncAuth=syncAuth;
})();
</script>
