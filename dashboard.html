<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedStart Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fafb;
    text-align: center;
    color: #222;
}

.dashboard {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    color: #087f8c;
    font-size: 38px;
    margin-bottom: 30px;
}

.stethoscope {
    width: 100%;
    max-width: 500px;
    height: 380px;
    object-fit: cover;
    border-radius: 20px;
    display: block;
    margin: 0 auto 30px;
}

.quiz {
    font-size: 21px;
    margin-bottom: 30px;
}

.quiz a {
    color: #087f8c;
    font-weight: bold;
    text-decoration: none;
}

.specialty-results {
    margin: 20px auto 40px;
    max-width: 550px;
}

.specialty-results h2 {
    color: #087f8c;
    margin-bottom: 15px;
}

.specialty {
    background: white;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
    font-size: 18px;
    font-weight: bold;
}

.redo {
    display: inline-block;
    margin-top: 12px;
    color: #087f8c;
    font-weight: bold;
    text-decoration: none;
    font-size: 17px;
}

.home {
    display: inline-block;
    background: #087f8c;
    color: white;
    padding: 14px 40px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="dashboard">

    <h1>
        Hey, <span id="name">Student</span>!
    </h1>

    <img
        class="stethoscope"
        src="https://images.pexels.com/photos/6320167/pexels-photo-6320167.jpeg"
        alt="Stethoscope"
    >

    <div id="quizArea"></div>

    <a href="https://medstart.com.ng/index.html" class="home">
        Home
    </a>

</div>

<script>
/* ================= USER NAME ================= */
const user = JSON.parse(localStorage.getItem("medstartUser") || "null");
const signedIn = localStorage.getItem("medstartSignedIn") === "true";
if (user && user.name && signedIn) {
    document.getElementById("name").textContent = user.name;
}

/* ================= SPECIALTY QUIZ RESULTS ================= */
let quizSaved = null;
try {
    if (signedIn && user && user.email) {
        const qByUser = JSON.parse(localStorage.getItem("medstartQuizResultsByUser") || "{}");
        quizSaved = qByUser[user.email] || null;
    }
    if (!quizSaved) quizSaved = JSON.parse(localStorage.getItem("medstartQuizResults") || "null");
} catch (e) { quizSaved = null; }
const quizArea = document.getElementById("quizArea");
let quizHtml = "";

if (quizSaved && Array.isArray(quizSaved.results) && quizSaved.results.length) {
    quizHtml = `
        <div class="specialty-results">
            <h2>🎯 Your Top Specialties</h2>
            ${quizSaved.results.slice(0,5).map((specialty, index) => `
                <div class="specialty">
                    #${index + 1} ${specialty.name}
                    ${specialty.score != null ? `<div style="font-size:14px;margin-top:5px;font-weight:normal;">Preference alignment: ${specialty.score}%</div>` : ""}
                </div>
            `).join("")}
            <a class="redo" href="https://medstart.com.ng/specialty-quiz.html">🔄 Redo the test</a>
        </div>`;
} else {
    quizHtml = `
        <div class="quiz">
            Click <a href="https://medstart.com.ng/specialty-quiz.html">here</a>
            to take the Specialty Quiz.
        </div>`;
}

/* ================= CLINICAL CASE RESULTS ================= */
let caseResults = {};
try {
    if (signedIn && user && user.email) {
        const byUser = JSON.parse(localStorage.getItem("medstartCaseResultsByUser") || "{}");
        caseResults = byUser[user.email] || {};
    }
    if (!Object.keys(caseResults).length) {
        caseResults = JSON.parse(localStorage.getItem("medstartCaseResults") || "{}");
    }
} catch (e) { caseResults = {}; }

let caseHtml = "";
const entries = Object.values(caseResults || {}).sort((a,b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));

if (entries.length) {
    caseHtml = `
        <div class="specialty-results">
            <h2>🩺 Your Clinical Case Results</h2>
            ${entries.map(r => `
                <div class="specialty">
                    ${r.specialty}
                    <div style="font-size:15px;margin-top:6px;font-weight:normal;">
                        ${r.score}/${r.total} (${Math.round((r.score / r.total) * 100)}%) · ${r.completedCases} cases completed
                    </div>
                </div>
            `).join("")}
            <a class="redo" href="https://medstart.com.ng/cases.html">🔄 Continue / retry cases</a>
        </div>`;
} else {
    caseHtml = `
        <div class="quiz">
            Your completed specialty case results will appear here after you finish a specialty's 5 cases.
        </div>`;
}

quizArea.innerHTML = quizHtml + caseHtml;

window.addEventListener("storage", function(){ location.reload(); });
window.addEventListener("medstart-auth-changed", function(){ location.reload(); });
</script>

<script id="medstart-global-auth">
(function(){
  function readUser(){try{return JSON.parse(localStorage.getItem('medstartUser')||'null')}catch(e){return null}}
  function isSigned(){return localStorage.getItem('medstartSignedIn')==='true'}
  function syncAuth(){
    var user=readUser(), signed=isSigned(), name=(user&&user.name||'').trim();
    // The navigation never contains a Sign Up item.
    document.querySelectorAll('.nav a').forEach(function(a){
      if((a.getAttribute('href')||'').toLowerCase().replace(/^\.\//,'')==='signup.html' || /^(sign\s*up)$/i.test(a.textContent.trim())) a.remove();
    });
    // Keep the header account button on every normal site page.
    document.querySelectorAll('a.signup,[data-auth="signup"]').forEach(function(a){
      if(signed && name){a.textContent=name;a.href='dashboard.html';a.style.display='inline-block';a.classList.add('signed-user');}
      else {a.textContent='Sign Up';a.href='signup.html';a.style.display='inline-block';a.classList.remove('signed-user');}
    });
    document.querySelectorAll('.nav a').forEach(function(a){
      var href=(a.getAttribute('href')||'').toLowerCase().replace(/^\.\//,'');
      if(signed && (href==='signin.html'||href==='sign-in.html')) a.remove();
    });
    document.querySelectorAll('[data-auth-name]').forEach(function(el){el.textContent=signed&&name?name:'Guest';});
    // Attach any anonymous case results to the signed-in account, so results completed before login remain visible.
    if(signed && user && user.email){
      try{
        var generic=JSON.parse(localStorage.getItem('medstartCaseResults')||'{}');
        var by=JSON.parse(localStorage.getItem('medstartCaseResultsByUser')||'{}');
        by[user.email]=by[user.email]||{};
        Object.keys(generic||{}).forEach(function(k){if(!by[user.email][k]) by[user.email][k]=generic[k];});
        localStorage.setItem('medstartCaseResultsByUser',JSON.stringify(by));
        var q=JSON.parse(localStorage.getItem('medstartQuizResults')||'null');
        if(q && !JSON.parse(localStorage.getItem('medstartQuizResultsByUser')||'{}')[user.email]){var qb=JSON.parse(localStorage.getItem('medstartQuizResultsByUser')||'{}');qb[user.email]=q;localStorage.setItem('medstartQuizResultsByUser',JSON.stringify(qb));}
      }catch(e){}
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncAuth);else syncAuth();
  window.addEventListener('storage',syncAuth);
  window.addEventListener('medstart-auth-changed',syncAuth);
  window.medstartSyncAuth=syncAuth;
})();
</script>
</body>
</html>
