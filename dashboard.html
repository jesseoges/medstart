<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedStart Dashboard</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f9ff;
color:#222;
}

/* HEADER */

header{
background:#1677c8;
color:white;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:25px;
font-weight:bold;
}

.logout{
background:white;
color:#1677c8;
border:0;
padding:9px 15px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}

/* CONTENT */

.container{
width:92%;
max-width:1100px;
margin:30px auto;
}

.welcome{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 15px #0001;
margin-bottom:25px;
}

.welcome h1{
margin:0 0 8px;
color:#1677c8;
}

.welcome p{
color:#666;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 3px 15px #0001;
transition:.2s;
}

.card:hover{
transform:translateY(-3px);
}

.icon{
font-size:35px;
margin-bottom:10px;
}

.card h2{
margin:5px 0;
color:#1677c8;
font-size:20px;
}

.card p{
color:#666;
line-height:1.5;
}

.card button{
background:#1677c8;
color:white;
border:0;
padding:11px 18px;
border-radius:7px;
cursor:pointer;
font-weight:bold;
}

/* FOOTER */

footer{
text-align:center;
color:#777;
padding:30px;
}

</style>
</head
