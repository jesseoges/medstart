<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedStart Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fafb;
    text-align: center;
    color: #222;
}

.dashboard {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    color: #087f8c;
    font-size: 38px;
    margin-bottom: 30px;
}

.stethoscope {
    width: 100%;
    max-width: 500px;
    height: 380px;
    object-fit: cover;
    border-radius: 20px;
    display: block;
    margin: 0 auto 30px;
}

.quiz {
    font-size: 21px;
    margin-bottom: 30px;
}

.quiz a {
    color: #087f8c;
    font-weight: bold;
    text-decoration: none;
}

.specialty-results {
    margin: 20px auto 40px;
    max-width: 550px;
}

.specialty-results h2 {
    color: #087f8c;
    margin-bottom: 15px;
}

.specialty {
    background: white;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
    font-size: 18px;
    font-weight: bold;
}

.redo {
    display: inline-block;
    margin-top: 12px;
    color: #087f8c;
    font-weight: bold;
    text-decoration: none;
    font-size: 17px;
}

.home {
    display: inline-block;
    background: #087f8c;
    color: white;
    padding: 14px 40px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="dashboard">

    <h1>
        Hey, <span id="name">Student</span>!
    </h1>

    <img
        class="stethoscope"
        src="https://images.pexels.com/photos/6320167/pexels-photo-6320167.jpeg"
        alt="Stethoscope"
    >

    <div id="quizArea"></div>

    <a href="https://medstart.com.ng/index.html" class="home">
        Home
    </a>

</div>

<script>

/* ================= USER NAME ================= */

const user = JSON.parse(localStorage.getItem("medstartUser"));

if (user && user.name) {
    document.getElementById("name").textContent = user.name;
}


/* ================= SPECIALTY RESULTS ================= */

const savedResults = JSON.parse(
    localStorage.getItem("medstartSpecialtyResults")
);

const quizArea = document.getElementById("quizArea");


if (savedResults && savedResults.length > 0) {

    quizArea.innerHTML = `

        <div class="specialty-results">

            <h2>🎯 Your Top Specialties</h2>

            ${savedResults.map((specialty, index) => `
                <div class="specialty">
                    #${index + 1} ${specialty.name}
                </div>
            `).join("")}

            <a
                class="redo"
                href="https://medstart.com.ng/specialty-quiz.html"
            >
                🔄 Redo the test
            </a>

        </div>

    `;

} else {

    quizArea.innerHTML = `

        <div class="quiz">

            Click
            <a href="https://medstart.com.ng/specialty-quiz.html">
                here
            </a>
            to take the Specialty Quiz.

        </div>

    `;

}

</script>

</body>
</html>
