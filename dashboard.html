<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MedStart Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5fafb;
    text-align: center;
    color: #222;
}

.dashboard {
    max-width: 700px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    color: #087f8c;
    font-size: 38px;
    margin-bottom: 30px;
}

.stethoscope {
    width: 100%;
    max-width: 500px;
    height: 380px;
    object-fit: cover;
    border-radius: 20px;
    display: block;
    margin: 0 auto 30px;
}

.quiz {
    font-size: 21px;
    margin-bottom: 30px;
}

.quiz a {
    color: #087f8c;
    font-weight: bold;
    text-decoration: none;
}

.specialty-results {
    margin: 20px auto 40px;
    max-width: 550px;
}

.specialty-results h2 {
    color: #087f8c;
    margin-bottom: 15px;
}

.specialty {
    background: white;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ddd;
    font-size: 18px;
    font-weight: bold;
}

.redo {
    display: inline-block;
    margin-top: 12px;
    color: #087f8c;
    font-weight: bold;
    text-decoration: none;
    font-size: 17px;
}

.home {
    display: inline-block;
    background: #087f8c;
    color: white;
    padding: 14px 40px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="dashboard">

    <h1>
        Hey, <span id="name">Student</span>!
    </h1>

    <img
        class="stethoscope"
        src="https://images.pexels.com/photos/6320167/pexels-photo-6320167.jpeg"
        alt="Stethoscope"
    >

    <div id="quizArea"></div>

    <a href="https://medstart.com.ng/index.html" class="home">
        Home
    </a>

</div>

<script>
/* ================= USER NAME ================= */
const user = JSON.parse(localStorage.getItem("medstartUser") || "null");
const signedIn = localStorage.getItem("medstartSignedIn") === "true";
if (user && user.name && signedIn) {
    document.getElementById("name").textContent = user.name;
}

/* ================= SPECIALTY QUIZ RESULTS ================= */
const quizSaved = JSON.parse(localStorage.getItem("medstartQuizResults") || "null");
const quizArea = document.getElementById("quizArea");
let quizHtml = "";

if (quizSaved && Array.isArray(quizSaved.results) && quizSaved.results.length) {
    quizHtml = `
        <div class="specialty-results">
            <h2>🎯 Your Top Specialties</h2>
            ${quizSaved.results.slice(0,5).map((specialty, index) => `
                <div class="specialty">
                    #${index + 1} ${specialty.name}
                    ${specialty.score != null ? `<div style="font-size:14px;margin-top:5px;font-weight:normal;">Preference alignment: ${specialty.score}%</div>` : ""}
                </div>
            `).join("")}
            <a class="redo" href="https://medstart.com.ng/specialty-quiz.html">🔄 Redo the test</a>
        </div>`;
} else {
    quizHtml = `
        <div class="quiz">
            Click <a href="https://medstart.com.ng/specialty-quiz.html">here</a>
            to take the Specialty Quiz.
        </div>`;
}

/* ================= CLINICAL CASE RESULTS ================= */
let caseResults = null;
if (signedIn && user && user.email) {
    try {
        const byUser = JSON.parse(localStorage.getItem("medstartCaseResultsByUser") || "{}");
        caseResults = byUser[user.email] || {};
    } catch (e) { caseResults = {}; }
} else {
    try { caseResults = JSON.parse(localStorage.getItem("medstartCaseResults") || "{}"); }
    catch (e) { caseResults = {}; }
}

let caseHtml = "";
const entries = Object.values(caseResults || {}).sort((a,b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));

if (entries.length) {
    caseHtml = `
        <div class="specialty-results">
            <h2>🩺 Your Clinical Case Results</h2>
            ${entries.map(r => `
                <div class="specialty">
                    ${r.specialty}
                    <div style="font-size:15px;margin-top:6px;font-weight:normal;">
                        ${r.score}/${r.total} (${Math.round((r.score / r.total) * 100)}%) · ${r.completedCases} cases completed
                    </div>
                </div>
            `).join("")}
            <a class="redo" href="https://medstart.com.ng/cases.html">🔄 Continue / retry cases</a>
        </div>`;
} else {
    caseHtml = `
        <div class="quiz">
            Your completed specialty case results will appear here after you finish a specialty's 5 cases.
        </div>`;
}

quizArea.innerHTML = quizHtml + caseHtml;
</script>

<script id="medstart-global-auth">
(function(){
  function syncAuth(){
    let user=null,signed=false;
    try{
      user=JSON.parse(localStorage.getItem('medstartUser')||'null');
      signed=localStorage.getItem('medstartSignedIn')==='true';
    }catch(e){}
    if(!signed||!user)return;
    const name=(user.name||'My Account').trim()||'My Account';
    document.querySelectorAll('a[href="signup.html"],a[href="./signup.html"],[data-auth="signup"]').forEach(function(el){
      el.textContent=name;
      el.href='dashboard.html';
      el.style.display='inline-block';
    });
    document.querySelectorAll('a[href="signin.html"],a[href="./signin.html"],a[href="sign-in.html"],a[href="./sign-in.html"],[data-auth="signin"]').forEach(function(el){
      el.style.display='none';
    });
    document.querySelectorAll('[data-auth-name]').forEach(function(el){el.textContent=name;});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',syncAuth);else syncAuth();
  window.addEventListener('storage',syncAuth);
})();
</script></body>
</html>
