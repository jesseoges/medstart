<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedStart - Account</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f8fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    color:#087f8c;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    margin-bottom:20px;
}

.tabs button{
    width:50%;
    padding:12px;
    border:0;
    cursor:pointer;
    background:#eee;
    font-size:16px;
}

.tabs button.active{
    background:#087f8c;
    color:white;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.submit{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#087f8c;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.submit:hover{
    background:#066b76;
}

.message{
    text-align:center;
    color:#d00;
    margin-top:12px;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>

<div class="container">

    <h1>MedStart</h1>
    <p class="subtitle">Medical Learning Platform</p>

    <div class="tabs">
        <button id="signInTab" class="active" onclick="showForm('signin')">
            Sign In
        </button>

        <button id="signUpTab" onclick="showForm('signup')">
            Create Account
        </button>
    </div>

    <!-- SIGN IN -->
    <div id="signin" class="form active">

        <form onsubmit="signIn(event)">

            <label>Email</label>
            <input type="email" id="loginEmail" required>

            <label>Password</label>
            <input type="password" id="loginPassword" required>

            <button class="submit" type="submit">
                Sign In
            </button>

            <p id="loginMessage" class="message"></p>

        </form>
    </div>


    <!-- CREATE ACCOUNT -->
    <div id="signup" class="form">

        <form onsubmit="createAccount(event)">

            <label>Full Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Password</label>
            <input type="password" id="password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required>

            <button class="submit" type="submit">
                Create Account
            </button>

            <p id="signupMessage" class="message"></p>

        </form>
    </div>

</div>


<script>

const EMAILJS_PUBLIC_KEY = 'YOUR_EMAILJS_PUBLIC_KEY';
const EMAILJS_SERVICE_ID = 'YOUR_EMAILJS_SERVICE_ID';
const EMAILJS_TEMPLATE_ID = 'YOUR_EMAILJS_TEMPLATE_ID';

/* SWITCH BETWEEN SIGN IN AND SIGN UP */

function showForm(form){

    document.getElementById("signin").classList.remove("active");
    document.getElementById("signup").classList.remove("active");

    document.getElementById("signInTab").classList.remove("active");
    document.getElementById("signUpTab").classList.remove("active");

    if(form === "signin"){

        document.getElementById("signin").classList.add("active");
        document.getElementById("signInTab").classList.add("active");

    }else{

        document.getElementById("signup").classList.add("active");
        document.getElementById("signUpTab").classList.add("active");

    }
}


/* CREATE ACCOUNT */

function createAccount(event){
    event.preventDefault();
    const name=document.getElementById("name").value.trim();
    const email=document.getElementById("email").value.trim().toLowerCase();
    const password=document.getElementById("password").value;
    const confirmPassword=document.getElementById("confirmPassword").value;
    const message=document.getElementById("signupMessage");
    if(!name){message.textContent="Enter your full name.";return;}
    if(!email || email.indexOf("@")<1){message.textContent="Enter a valid email address.";return;}
    if(password.length<6){message.textContent="Password must be at least 6 characters.";return;}
    if(password!==confirmPassword){message.textContent="Passwords do not match.";return;}
    try{
      localStorage.setItem("medstartAccount",JSON.stringify({name:name,email:email,password:password}));
      localStorage.setItem("medstartUser",JSON.stringify({name:name,email:email}));
      localStorage.setItem("medstartSignedIn","true");
      localStorage.setItem("medstartSignedInEmail",email);
      window.dispatchEvent(new Event("medstart-auth-changed"));
      message.textContent="Account created successfully.";
      setTimeout(function(){window.location.href="index.html";},250);
    }catch(err){
      message.textContent="Local Storage is blocked in this browser/preview. Open the site in Chrome or Firefox as a normal page.";
    }
}


/* SIGN IN */

function signIn(event){
    event.preventDefault();
    const email=document.getElementById("loginEmail").value.trim().toLowerCase();
    const password=document.getElementById("loginPassword").value;
    const message=document.getElementById("loginMessage");
    let account=null;
    try{account=JSON.parse(localStorage.getItem("medstartAccount")||"null");}catch(e){account=null;}
    if(!account){message.textContent="No account found. Please create an account first.";return;}
    if(email!==String(account.email||"").toLowerCase() || password!==String(account.password||"")){message.textContent="Incorrect email or password.";return;}
    localStorage.setItem("medstartUser",JSON.stringify({name:account.name,email:account.email}));
    localStorage.setItem("medstartSignedIn","true");
    localStorage.setItem("medstartSignedInEmail",account.email);
    window.dispatchEvent(new Event("medstart-auth-changed"));
    message.textContent="Signed in successfully.";
    setTimeout(function(){window.location.href="index.html";},250);
}

</script>


<script id="medstart-global-auth-v2">
(function(){
  function readUser(){try{return JSON.parse(localStorage.getItem('medstartUser')||'null')}catch(e){return null}}
  function isSigned(){try{return localStorage.getItem('medstartSignedIn')==='true'}catch(e){return false}}
  function sync(){
    var u=readUser(), signed=isSigned(), name=(u&&u.name||'').trim();
    document.querySelectorAll('.nav a').forEach(function(a){
      var h=(a.getAttribute('href')||'').toLowerCase().replace(/^\.\//,'');
      if(h==='signup.html' || /^sign\s*up$/i.test(a.textContent.trim())) a.remove();
      if(signed && (h==='signin.html'||h==='sign-in.html'||/^sign\s*in$/i.test(a.textContent.trim()))) a.remove();
    });
    var controls=document.querySelectorAll('a.signup,[data-auth="account"]');
    controls.forEach(function(a){
      a.textContent=(signed&&name)?name:'Sign Up';
      a.href=(signed&&name)?'dashboard.html':'signup.html';
      a.style.display='inline-block';
      a.classList.toggle('signed-user',!!(signed&&name));
    });
    document.querySelectorAll('[data-auth-name]').forEach(function(el){el.textContent=(signed&&name)?name:'Guest'});
    // Add a consistent account button to headers that do not already have one.
    if(!document.querySelector('a.signup,[data-auth="account"]') && !/^(signup|signin|sign-in)\.html$/i.test(location.pathname.split('/').pop())){
      var top=document.querySelector('.top')||document.querySelector('.header-inner');
      if(top){var a=document.createElement('a');a.className='signup';a.setAttribute('data-auth','account');a.textContent=(signed&&name)?name:'Sign Up';a.href=(signed&&name)?'dashboard.html':'signup.html';top.appendChild(a);}
    }
    if(signed&&u&&u.email){
      try{
        var by=JSON.parse(localStorage.getItem('medstartCaseResultsByUser')||'{}');
        var generic=JSON.parse(localStorage.getItem('medstartCaseResults')||'{}');
        by[u.email]=by[u.email]||{};
        Object.keys(generic||{}).forEach(function(k){if(!by[u.email][k])by[u.email][k]=generic[k]});
        localStorage.setItem('medstartCaseResultsByUser',JSON.stringify(by));
      }catch(e){}
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync);else sync();
  window.addEventListener('storage',sync);window.addEventListener('medstart-auth-changed',sync);window.addEventListener('medstart-case-results-updated',sync);
  window.medstartSyncAuth=sync;
})();
</script>
</body>
</html>
