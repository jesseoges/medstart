<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedStart Specialty Quiz</title>
<style>
body{font-family:Arial;margin:0;background:#f3f8fa;color:#17313b}
.box{max-width:760px;margin:20px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 3px 15px #ccd}
h1{text-align:center;color:#087f8c}
.q{font-size:19px;font-weight:bold;margin:20px 0}
.opt{display:block;width:100%;padding:13px;margin:9px 0;border:1px solid #ccd;border-radius:9px;background:#f8fbfc;text-align:left;cursor:pointer}
.opt:hover{background:#e7f5f6}
button{padding:13px 22px;border:0;border-radius:9px;background:#087f8c;color:white;font-weight:bold;cursor:pointer}
.bar{height:10px;background:#ddd;border-radius:10px;margin:10px 0 20px}
.fill{height:100%;background:#087f8c;border-radius:10px}
.rank{display:flex;gap:8px;margin:10px 0}
.rank select{padding:8px}
input[type=range]{width:100%}
.result{padding:15px;margin:10px 0;background:#eef8f9;border-radius:10px}
small{color:#567}
</style>
</head>

<body>
<div class="box">
<h1>🩺 MedStart Specialty Quiz</h1>
<div id="quiz"></div>
</div>

<script>
const specialties=[
["Cardiology",["heart","physiology","technology","long-term care"]],
["Interventional Cardiology",["procedures","heart","technology","acute care"]],
["Neurology",["brain","diagnosis","complex cases","long-term care"]],
["Neurosurgery",["brain","procedures","precision","acute care"]],
["Gastroenterology",["diagnosis","procedures","digestive","technology"]],
["Hepatology",["liver","diagnosis","long-term care","complex cases"]],
["Endocrinology",["hormones","diagnosis","long-term care","research"]],
["Nephrology",["kidney","physiology","long-term care","complex cases"]],
["Pulmonology",["lungs","diagnosis","critical care","technology"]],
["Rheumatology",["immune system","diagnosis","long-term care","complex cases"]],
["Infectious Disease",["infection","diagnosis","research","public health"]],
["Hematology",["blood","diagnosis","research","complex cases"]],
["Medical Oncology",["cancer","research","technology","long-term care"]],
["Allergy & Immunology",["immune system","diagnosis","research","patient education"]],
["General Surgery",["procedures","variety","acute care","teamwork"]],
["Orthopedic Surgery",["movement","procedures","precision","rehabilitation"]],
["Cardiothoracic Surgery",["heart","lungs","procedures","precision"]],
["Vascular Surgery",["blood vessels","procedures","technology","acute care"]],
["Plastic Surgery",["precision","procedures","creativity","reconstruction"]],
["Urology",["procedures","technology","long-term care","surgery"]],
["Otolaryngology",["head and neck","procedures","technology","variety"]],
["Ophthalmology",["eyes","precision","technology","procedures"]],
["Obstetrics & Gynecology",["women","procedures","long-term care","acute care"]],
["Maternal-Fetal Medicine",["pregnancy","complex cases","technology","women"]],
["Pediatrics",["children","communication","long-term care","variety"]],
["Neonatology",["newborns","critical care","technology","acute care"]],
["Pediatric Cardiology",["children","heart","technology","long-term care"]],
["Child Psychiatry",["children","communication","mental health","long-term care"]],
["Psychiatry",["mental health","communication","long-term care","complex cases"]],
["Emergency Medicine",["acute care","variety","quick decisions","teamwork"]],
["Anesthesiology",["physiology","procedures","technology","acute care"]],
["Critical Care Medicine",["critical care","physiology","technology","teamwork"]],
["Radiology",["imaging","technology","diagnosis","problem solving"]],
["Interventional Radiology",["imaging","procedures","technology","precision"]],
["Pathology",["laboratory","diagnosis","research","problem solving"]],
["Dermatology",["skin","diagnosis","long-term care","procedures"]],
["Ophthalmology Retina",["eyes","precision","technology","procedures"]],
["Family Medicine",["variety","communication","long-term care","community"]],
["Internal Medicine",["diagnosis","complex cases","long-term care","variety"]],
["Geriatrics",["older adults","communication","long-term care","complex cases"]],
["Sports Medicine",["movement","rehabilitation","prevention","communication"]],
["Physical Medicine & Rehabilitation",["rehabilitation","communication","long-term care","movement"]],
["Public Health Medicine",["community","prevention","research","population"]],
["Occupational Medicine",["prevention","workplace","public health","long-term care"]],
["Preventive Medicine",["prevention","research","community","public health"]],
["Genetics",["genetics","diagnosis","research","communication"]],
["Palliative Medicine",["communication","long-term care","complex cases","patient relationship"]]
];

const questions=[
["You are given a difficult problem with several possible explanations. What feels most satisfying?",[
["Finding the pattern hidden in the details",["diagnosis","problem solving","research"]],
["Understanding the person behind the problem",["communication","long-term care","patient relationship"]],
["Taking action when every minute matters",["acute care","quick decisions","teamwork"]],
["Using technology to reveal something invisible",["technology","imaging","precision"]]]],
["During a busy day, which kind of challenge would you naturally enjoy?",[
["A constantly changing mix of problems",["variety","acute care","quick decisions"]],
["Following one complicated problem over time",["complex cases","long-term care","diagnosis"]],
["Working with precise technical skills",["precision","procedures","technology"]],
["Exploring questions that could change future medicine",["research","innovation","laboratory"]]]],
["A patient asks you to explain a complicated condition. What approach sounds most natural?",[
["Draw it out and explain how everything connects",["communication","diagnosis","patient education"]],
["Focus on what we can do right now",["acute care","quick decisions"]],
["Discuss the evidence and uncertainty",["research","complex cases"]],
["Use images, tests or measurements to make it clearer",["technology","imaging","diagnosis"]]]],
["Which working environment sounds most appealing?",[
["A fast-moving clinical environment",["acute care","teamwork","variety"]],
["A quieter environment focused on analysis",["diagnosis","laboratory","problem solving"]],
["A setting where procedures and technology are central",["procedures","technology","precision"]],
["A clinic where relationships develop over years",["long-term care","communication","patient relationship"]]]],
["When learning something new, what tends to pull your attention first?",[
["How it works scientifically",["physiology","research"]],
["How it affects people",["patient relationship","communication"]],
["How to diagnose it",["diagnosis","problem solving"]],
["How to treat it practically",["procedures","acute care"]]]],
["Which outcome would feel most rewarding?",[
["Solving a mystery nobody else could explain",["diagnosis","complex cases"]],
["Seeing someone improve over months or years",["long-term care","patient relationship"]],
["Making a precise intervention work",["procedures","precision"]],
["Discovering something that changes medicine",["research","innovation"]]]]
];

let i=0,answers=[],life=5,priorities={};
const app=document.getElementById("quiz");

function show(){
if(i<questions.length){
let q=questions[i];
app.innerHTML=`<b>Question ${i+1} of ${questions.length}</b>
<div class="bar"><div class="fill" style="width:${(i/questions.length)*100}%"></div></div>
<div class="q">${q[0]}</div>`+
q[1].map((x,n)=>`<button class="opt" onclick="ans(${n})">${x[0]}</button>`).join("");
}else lifestyle();
}

function ans(n){answers.push(questions[i][1][n][1]);i++;show()}

function lifestyle(){
app.innerHTML=`<b>Lifestyle Balance</b>
<div class="q">How important is having a predictable, balanced lifestyle to you?</div>
<input type="range" min="1" max="10" value="5" oninput="life=this.value;document.getElementById('lv').innerText=this.value">
<p>1 = Not very important &nbsp;&nbsp; 10 = Extremely important</p>
<h2 id="lv">5</h2>
<button onclick="prior()">Continue</button>`;
}

function prior(){
let items=["Prestige","Innovation","Fame","Income","Patient relationship"];
app.innerHTML=`<b>Your Priorities</b>
<p>Rank these from <b>1 (most important)</b> to <b>5 (least important)</b>.</p>`+
items.map((x,n)=>`<div class="rank">${x}
<select id="p${n}">${[1,2,3,4,5].map(v=>`<option>${v}</option>`).join("")}</select></div>`).join("")+
`<button onclick="results()">See My Results</button>`;
}

function results(){
let keys={};
answers.flat().forEach(x=>keys[x]=(keys[x]||0)+1);

let scored=specialties.map(s=>{
let score=0;
s[1].forEach(k=>score+=(keys[k]||0));
return [s[0],score];
}).sort((a,b)=>b[1]-a[1]);

let top=scored.slice(0,5);
let max=top[0][1]||1;

/* Lifestyle changes weighting rather than producing a perfect match */
top=top.map((x,n)=>{
let pct=Math.round((x[1]/max)*78-(n*7)+10);
return [x[0],Math.max(34,Math.min(92,pct))];
});

app.innerHTML=`<h2>🎯 Your Top 5 Matches</h2>
<p>These are compatibility scores, not predictions. Your results can change as your interests develop.</p>`+
top.map((x,n)=>`<div class="result">
<b>#${n+1} ${x[0]}</b><br>
<strong>${x[1]}% match</strong><br>
<small>${reason(x[0])}</small></div>`).join("")+
`<button onclick="location.reload()">Retake Quiz</button>`;
}

function reason(s){
let r={
"Cardiology":"Strong fit for analytical thinking, physiology and meaningful long-term care.",
"Neurology":"Fits curiosity about complex problems and detailed diagnosis.",
"Psychiatry":"Fits communication, human behaviour and long-term patient relationships.",
"Radiology":"Fits pattern recognition, technology and diagnostic problem solving.",
"Pediatrics":"Fits communication, variety and building trust with younger patients.",
"Emergency Medicine":"Fits quick decisions, variety and teamwork.",
"Anesthesiology":"Fits physiology, precision, procedures and acute decision-making.",
"Pathology":"Fits analytical thinking, diagnosis, laboratory work and investigation.",
"Dermatology":"Fits diagnosis, continuity of care and focused clinical problem solving.",
"General Surgery":"Fits practical problem solving, procedures and variety."
};
return r[s]||"Your answers suggest a strong connection with the problem-solving style and patient environment of this specialty.";
}

show();
</script>
</body>
</html>
