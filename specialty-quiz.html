<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedStart Specialty Quiz</title>
<style>
body{font-family:Arial;background:#f2f8fa;margin:0;padding:20px}
.box{max-width:700px;margin:auto;background:white;padding:25px;border-radius:15px}
h1{text-align:center;color:#087f8c}
.option{padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:10px;cursor:pointer}
.option:hover,.selected{border-color:#087f8c;background:#eaf8f9}
button{padding:13px 25px;border:0;border-radius:8px;background:#087f8c;color:white;font-weight:bold;cursor:pointer}
#result{display:none}
</style>
</head>

<body>
<div class="box">

<h1>MedStart Specialty Quiz</h1>

<div id="quiz">
<p id="q"></p>
<div id="options"></div>
<button onclick="next()">Next</button>
</div>

<div id="result">
<h2>Your Top Matches</h2>
<div id="scores"></div>
<button onclick="location.reload()">Take Again</button>
</div>

</div>

<script>
const data=[
["Which work sounds most interesting?",["Emergency situations","Operations","Solving difficult diagnoses","Long-term patient care"],["Emergency Medicine","Surgery","Internal Medicine","Family Medicine"]],
["Which environment do you prefer?",["Fast-paced hospital","Operating room","Clinic","Technology and imaging"],["Emergency Medicine","Surgery","Family Medicine","Radiology"]],
["What do you enjoy most?",["Working with your hands","Analysing problems","Talking with people","Making quick decisions"],["Surgery","Internal Medicine","Psychiatry","Emergency Medicine"]],
["Which area interests you most?",["Brain and nerves","Heart","Bones and joints","Pregnancy and childbirth"],["Neurology","Cardiology","Orthopaedics","Obstetrics & Gynaecology"]],
["Which patients would you prefer?",["Children","Adults","Older people","All ages"],["Paediatrics","Internal Medicine","Geriatrics","Family Medicine"]],
["Which sounds most satisfying?",["Fixing a physical problem","Finding a diagnosis","Helping emotionally","Helping recovery"],["Surgery","Internal Medicine","Psychiatry","Rehabilitation"]],
["What pace suits you?",["Very fast","Busy but organised","Calm","A mixture"],["Emergency Medicine","Surgery","Psychiatry","Family Medicine"]],
["How interested are you in technology?",["Very interested","Somewhat","Not much","Mainly for diagnosis"],["Radiology","Cardiology","Surgery","Radiology"]],
["Which would you rather do?",["Procedures","Diagnosis","Patient conversations","Review scans"],["Surgery","Internal Medicine","Psychiatry","Radiology"]],
["What would make you most satisfied?",["A successful operation","Solving a difficult case","Helping someone emotionally","Helping someone physically"],["Surgery","Internal Medicine","Psychiatry","Orthopaedics"]]
];

let n=0,choice=null,s={};

function show(){
q.innerText=(n+1)+". "+data[n][0];
options.innerHTML="";
data[n][1].forEach((x,i)=>{
let d=document.createElement("div");
d.className="option";d.innerText=x;
d.onclick=()=>{choice=i;document.querySelectorAll(".option").forEach(a=>a.classList.remove("selected"));d.classList.add("selected")};
options.appendChild(d);
});
}

function next(){
if(choice===null)return alert("Choose an answer first.");
let sp=data[n][2][choice];
s[sp]=(s[sp]||0)+1;
choice=null;n++;
if(n<data.length)show();
else{
quiz.style.display="none";result.style.display="block";
let a=Object.entries(s).sort((x,y)=>y[1]-x[1]);
scores.innerHTML=a.slice(0,3).map((x,i)=>`<h3>${i+1}. ${x[0]}</h3>`).join("");
}
}
show();
</script>

</body>
</html>
